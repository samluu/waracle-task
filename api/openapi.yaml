openapi: 3.0.3
info:
  title: Hotel Booking API
  version: 0.1.0
  description: |
    Hotel room booking API for the Waracle Backend Developer Challenge.

    Dates are `YYYY-MM-DD`. A stay covers the nights from `check_in` up to, but not including,
    `check_out`, so a one-night stay checks out the day after it checks in. `check_in` can't be in
    the past or more than a year from today (UTC), and a stay can be at most 30 nights.
servers:
  - url: http://localhost:8080

paths:
  /health:
    get:
      operationId: getHealth
      summary: Service health
      description: Reports whether the API is up and can reach the database.
      responses:
        "200":
          description: API and database are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /hotels:
    get:
      operationId: findHotels
      summary: Find hotels by name
      description: |
        Fuzzy search: hotels whose name has words similar enough to `name`, ignoring case. Whole or
        partial words and small misspellings match: `grand`, `gran` and `grande` all find
        "The Grand Hotel". Searches of one or two letters are too short to match. Sorted by name.

        Results are paged like `GET /rooms`: repeat the request with `cursor` set to the response's
        `next_cursor` for the next page; the last page has no `next_cursor`.
      parameters:
        - name: name
          in: query
          required: true
          description: All or part of a hotel's name, in any case.
          schema:
            type: string
          example: grand
        - name: limit
          in: query
          required: false
          description: Hotels per page. Defaults to 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Omit for the first page.
          schema:
            type: string
      responses:
        "200":
          description: A page of hotels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelPage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /rooms:
    get:
      operationId: findRooms
      summary: Find rooms available for a stay
      description: |
        Rooms that are free for every night of the stay and can hold the given number of guests,
        across all hotels or just the one named. Sorted by hotel name, then room number.

        Results are paged. To get the next page, repeat the request with `cursor` set to the
        response's `next_cursor`; the last page has no `next_cursor`. Cursors are opaque.
      parameters:
        - name: check_in
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2027-01-11"
        - name: check_out
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2027-01-13"
        - name: guests
          in: query
          required: true
          description: Rooms must be able to hold this many guests.
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: hotel_name
          in: query
          required: false
          description: |
            Only search hotels whose name is a fuzzy match for this, as `GET /hotels` matches.
            Omit to search every hotel.
          schema:
            type: string
          example: grand
        - name: limit
          in: query
          required: false
          description: Rooms per page. Defaults to 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page. Omit for the first page.
          schema:
            type: string
      responses:
        "200":
          description: A page of available rooms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomPage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /bookings:
    post:
      operationId: createBooking
      summary: Book a room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequest"
      responses:
        "201":
          description: Booked.
          headers:
            Location:
              description: URL of the new booking.
              schema:
                type: string
              example: /bookings/3f2b8c1e-9a4d-4c6e-b1f0-7d2e5a9c4b13
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The room doesn't exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The room is already booked for at least one night of the stay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: More guests than the room's capacity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings/{reference}:
    get:
      operationId: getBooking
      summary: Find a booking by reference
      parameters:
        - name: reference
          in: path
          required: true
          description: The booking reference, a UUID. Anything that isn't a UUID is rejected with a 400.
          schema:
            type: string
            format: uuid
          example: 3f2b8c1e-9a4d-4c6e-b1f0-7d2e5a9c4b13
      responses:
        "200":
          description: The booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No booking with that reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/seed:
    post:
      operationId: seedData
      summary: Seed test data
      description: |
        For testing. Adds two hotels ("The Grand Hotel" and "Seaside Inn"), each with six rooms (two
        single, two double, two deluxe). It adds no bookings: make them with `POST /bookings`. Fails if
        the data is already there: reset first. Like the rest of the API it needs no authentication, so
        it isn't for production use.
      responses:
        "204":
          description: Seeded.
        "409":
          description: The test data is already there.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/reset:
    post:
      operationId: resetData
      summary: Remove all hotels, rooms and bookings
      description: |
        For testing. Removes every hotel, room and booking, ready for seeding. Room types are reference
        data and stay. Like the rest of the API it needs no authentication, so it isn't for production use.
      responses:
        "204":
          description: Reset.

components:
  responses:
    BadRequest:
      description: The request is invalid, e.g. a missing parameter or a check-out before check-in.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: check_out must be after check_in

    Hotel:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: The Grand Hotel

    RoomType:
      type: string
      enum: [single, double, deluxe]

    Room:
      type: object
      required: [id, number, type, capacity, hotel]
      properties:
        id:
          type: integer
          format: int64
          description: Use this as room_id when booking.
          example: 2
        number:
          type: string
          example: "102"
        type:
          $ref: "#/components/schemas/RoomType"
        capacity:
          type: integer
          description: Maximum number of guests.
          example: 1
        hotel:
          $ref: "#/components/schemas/Hotel"

    HotelPage:
      type: object
      required: [hotels]
      properties:
        hotels:
          type: array
          items:
            $ref: "#/components/schemas/Hotel"
        next_cursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent on the last page.

    RoomPage:
      type: object
      required: [rooms]
      properties:
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/Room"
        next_cursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent on the last page.

    BookingRequest:
      type: object
      required: [room_id, guest_name, guests, check_in, check_out]
      properties:
        room_id:
          type: integer
          format: int64
          example: 2
        guest_name:
          type: string
          description: The lead guest's name.
          example: Jane Doe
        guests:
          type: integer
          minimum: 1
          example: 1
        check_in:
          type: string
          format: date
          example: "2027-01-11"
        check_out:
          type: string
          format: date
          example: "2027-01-13"

    Booking:
      type: object
      required: [reference, guest_name, guests, check_in, check_out, created_at, room]
      properties:
        reference:
          type: string
          format: uuid
          example: 3f2b8c1e-9a4d-4c6e-b1f0-7d2e5a9c4b13
        guest_name:
          type: string
          example: Jane Doe
        guests:
          type: integer
          example: 1
        check_in:
          type: string
          format: date
          example: "2027-01-11"
        check_out:
          type: string
          format: date
          example: "2027-01-13"
        created_at:
          type: string
          format: date-time
        room:
          $ref: "#/components/schemas/Room"
